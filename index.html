<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Adivinhe a Palavra</title>
        <link rel="stylesheet" href="estiloFlex.css">
    </head>

    <body>
        <header>
            <h1>Happy Quizz</h1>
        </header>

        <main>
            <section id="tela-inicio" class="area-inicio">
                <p>Insira a palavra secreta:</p>
                <input type="password" id="palavra-secreta" placeholder="Digite aqui...">
                <button id="btn-comecar">Começar Jogo</button>
            </section>

            <section id="tela-jogo" class="hidden">
                <section class="area-imagem">
                    <img id="imagem" src="img/img1.png" alt="Desenho do personagem">
                </section>
                <section class="area-palavra">
                    <p id="palavra"></p>
                    <p id="mensagem"></p>
                    <p id="erros">Erros: 0 de 6</p>
                </section>
                <section class="teclado" id="teclado">
                    <button class="letra">A</button>
                    <button class="letra">B</button>
                    <button class="letra">C</button>
                    <button class="letra">D</button>
                    <button class="letra">E</button>
                    <button class="letra">F</button>
                    <button class="letra">G</button>
                    <button class="letra">H</button>
                    <button class="letra">I</button>
                    <button class="letra">J</button>
                    <button class="letra">K</button>
                    <button class="letra">L</button>
                    <button class="letra">M</button>
                    <button class="letra">N</button>
                    <button class="letra">O</button>
                    <button class="letra">P</button>
                    <button class="letra">Q</button>
                    <button class="letra">R</button>
                    <button class="letra">S</button>
                    <button class="letra">T</button>
                    <button class="letra">U</button>
                    <button class="letra">V</button>
                    <button class="letra">W</button>
                    <button class="letra">X</button>
                    <button class="letra">Y</button>
                    <button class="letra">Z</button>
                </section>
                <section class="area-reiniciar">
                    <button id="reiniciar" onclick="reiniciarJogo()">Reiniciar Partida</button>
                </section>
            </section>
        </main>
        <script src="jogo.js"></script>
    </body>
</html>
